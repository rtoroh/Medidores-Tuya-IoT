services:
  db:
    image: postgres:16-alpine
    container_name: tuya-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: tuya
      POSTGRES_PASSWORD: tuya
      POSTGRES_DB: tuyameters
      TZ: America/Bogota
      PGTZ: America/Bogota
    ports:
      - "5435:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tuya -d tuyameters"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build: .
    container_name: tuya-dashboard
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://tuya:tuya@db:5432/tuyameters
      TZ: America/Bogota
      PGTZ: America/Bogota
      PORT: "5000"
    ports:
      - "5000:5000"
    volumes:
      - ./config.json:/app/config.json:ro

  grafana:
    image: grafana/grafana:11.5.2
    container_name: tuya-grafana
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      TZ: America/Bogota
    ports:
      - "3002:3000"
    volumes:
      - grafana-storage:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards

volumes:
  pgdata:
  grafana-storage: